<!doctype html>
<html lang="en">
  <head>

    <title>Offline · Murali Preya project 1 Crore</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f4;

  <body>
    <div>
      <h1>You're offline</h1>
